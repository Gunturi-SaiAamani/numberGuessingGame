<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="maindiv">
        <br>
        <h1 align="center">Number Guessing Game</h1>
        <h1 id="text" align="center">Guess a number</h1>
        <div id="input">
            <form align="center">
                <table>
                    <tr>
                        <td>
                            <label>Enter your guess from (0-100)</label><br>
                            <input id="num" type="text" name="num">
                        </td>
                        <td>
                         <button id="sub">enter</button>
                        </td>
                    </tr>
                </table>
            </form>
             <h1 id="guess" align="center"></h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
